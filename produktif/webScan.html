<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Scanner (Karen UI - Sequence Logic)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        
        .bento-camera {
            position: relative; width: 100%; height: 100%; min-height: 400px;
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.1);
            border: 4px solid #334155;
            background: #10151a;
        }
        
        video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

        #karenCanvas {
            position: absolute; top: 50%; left: 0; width: 100%; height: 200px;
            transform: translateY(-50%); z-index: 10;
        }

        .karen-text-container {
            position: absolute; top: 20%; left: 0; right: 0;
            text-align: center; z-index: 20; padding: 0 20px;
        }

        .karen-text {
            font-family: 'VT323', monospace;
            color: #4ade80; font-size: 2.5rem; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); letter-spacing: 2px;
        }

        .crt-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none; z-index: 30;
        }

        #loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.98); z-index: 50;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #4ade80; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        /* Style untuk Secret Modal */
        #secretModal {
            transition: opacity 0.3s ease;
        }
        .scale-in { animation: scaleIn 0.3s ease forwards; }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Progress ring untuk Long Press - Hidden by default (opacity 0) to keep secret */
        .progress-ring-container {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .progress-ring-container.active {
            opacity: 1;
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <div id="loading">
        <div class="loader mb-4"></div>
        <h2 id="loadingText" class="text-xl font-bold text-green-400 font-mono">INITIALIZING SYSTEM...</h2>
        <p id="loadingDetail" class="text-gray-400 text-sm mt-2 text-center max-w-md px-4 font-mono">
            Memuat modul pengenalan wajah...
        </p>
    </div>

    <!-- SECRET MODAL -->
    <div id="secretModal" class="hidden fixed inset-0 bg-black/90 z-[60] flex justify-center items-center backdrop-blur-sm">
        <div class="bg-slate-900 border-2 border-green-500 p-6 rounded-2xl w-80 shadow-[0_0_50px_rgba(74,222,128,0.2)] scale-in">
            <h3 class="text-green-400 font-mono text-xl mb-4 text-center border-b border-green-500/30 pb-2">
                /// MANUAL OVERRIDE ///
            </h3>
            <p class="text-gray-400 text-xs font-mono mb-4 text-center">
                Pilih personel untuk melakukan absensi MANUAL (Fase 1: Datang).
            </p>
            <div class="space-y-3">
                <select id="manualNameSelect" class="w-full bg-black border border-green-500/50 text-green-300 p-2 rounded font-mono focus:outline-none focus:border-green-400">
                    <!-- Options diisi via JS -->
                </select>
                <button onclick="submitManualAttendance()" class="w-full py-2 bg-green-600 hover:bg-green-500 text-black font-bold font-mono rounded transition-colors">
                    EXECUTE SUBMIT
                </button>
                <button onclick="closeSecretModal()" class="w-full py-2 bg-transparent border border-red-500 text-red-500 hover:bg-red-900/20 font-mono rounded transition-colors text-xs">
                    CANCEL
                </button>
            </div>
        </div>
    </div>

    <header class="text-center mb-6 w-full max-w-6xl hidden md:block">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600 font-mono tracking-widest">
            K.A.R.E.N ATTENDANCE V2.3
        </h1>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 w-full max-w-6xl h-[85vh]">
        
        <div class="lg:col-span-2 h-full">
            <div class="bento-camera relative group">
                <div class="crt-overlay"></div>
                <video id="video" autoplay muted playsinline></video>
                <div class="karen-text-container">
                    <h1 id="karenDialog" class="karen-text">STANDBY...</h1>
                </div>
                <canvas id="karenCanvas"></canvas>

                <div class="absolute top-4 left-4 z-40 bg-green-900/20 border border-green-500/30 px-3 py-1 rounded">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-[10px] text-green-400 font-mono tracking-widest">CAMERA ACTIVE</span>
                    </div>
                </div>

                <div class="absolute top-4 right-4 z-40">
                    <select id="cameraSelect" class="bg-black/50 border border-green-500/30 text-green-400 text-xs p-1 rounded font-mono focus:outline-none">
                        <option value="">INPUT SOURCE...</option>
                    </select>
                </div>

                <div class="absolute bottom-10 left-0 right-0 flex justify-center items-center z-40">
                    
                    <!-- Button Scan dengan Fitur Long Press -->
                    <div class="relative">
                        <!-- Indikator Long Press (Rahasia/Hidden until pressed) -->
                        <div id="progressRing" class="progress-ring-container absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-28 h-28 pointer-events-none" style="z-index: -1;">
                            <svg class="w-full h-full">
                               <circle class="progress-ring__circle" stroke="#ef4444" stroke-width="4" fill="transparent" r="48" cx="56" cy="56" 
                                       style="stroke-dasharray: 301.59; stroke-dashoffset: 301.59;"/>
                            </svg>
                        </div>

                        <button id="btnScan" 
                            class="w-24 h-24 rounded-full bg-black border-2 border-green-500 text-green-400 shadow-[0_0_30px_rgba(74,222,128,0.2)] hover:shadow-[0_0_50px_rgba(74,222,128,0.6)] hover:scale-105 active:scale-95 transition-all duration-300 flex items-center justify-center group relative overflow-hidden select-none">
                            <div class="absolute inset-0 bg-green-500/10 group-hover:bg-green-500/20 transition-colors"></div>
                            <svg class="w-10 h-10 group-hover:rotate-90 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path></svg>
                        </button>
                    </div>

                    <div id="actionButtons" class="hidden flex items-center gap-8 animate-in slide-in-from-bottom-4 fade-in duration-300">
                        <button onclick="resetScanner()" 
                            class="w-20 h-20 rounded-full bg-black border border-red-500 text-red-500 hover:bg-red-900/20 shadow-lg hover:scale-110 active:scale-95 transition-all flex items-center justify-center">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                        <button onclick="saveAttendance()" id="btnSave"
                            class="w-20 h-20 rounded-full bg-black border border-green-500 text-green-500 hover:bg-green-900/20 shadow-lg hover:scale-110 active:scale-95 transition-all flex items-center justify-center">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="h-full flex flex-col gap-6">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-md font-semibold text-green-300 font-mono">DATE.LOG</h2>
                    <span id="currentDateDisplay" class="text-xs text-gray-400 font-mono">...</span>
                </div>
                <div class="text-center">
                    <div class="flex justify-between mb-2 text-sm font-bold text-gray-300 font-mono">
                        <span id="calMonth">...</span>
                        <span id="calYear">...</span>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-[10px] text-gray-500 mb-1 uppercase tracking-wider font-mono">
                        <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                    </div>
                    <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-sm font-mono"></div>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl flex-grow flex flex-col items-center justify-center overflow-hidden">
                <div class="text-center space-y-4">
                    <div class="w-16 h-16 mx-auto bg-green-500/10 rounded-full flex items-center justify-center border border-green-500/30">
                        <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-green-300 font-mono mb-1">ALLAH</h2>
                        <h2 class="text-2xl font-bold text-green-300 font-mono">MAHA MELIHAT</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    
    <script>
        const canvasWave = document.getElementById('karenCanvas');
        const ctxWave = canvasWave.getContext('2d');
        let wavePhase = 0;
        let waveSpeed = 0.05; 
        let waveAmplitude = 10; 

        function resizeCanvas() {
            canvasWave.width = canvasWave.parentElement.clientWidth;
            canvasWave.height = 200;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function animateKaren() {
            ctxWave.clearRect(0, 0, canvasWave.width, canvasWave.height);
            ctxWave.beginPath();
            ctxWave.strokeStyle = '#4ade80';
            ctxWave.lineWidth = 3;
            ctxWave.shadowBlur = 10;
            ctxWave.shadowColor = '#4ade80';
            const centerY = canvasWave.height / 2;
            for (let x = 0; x < canvasWave.width; x++) {
                const y = centerY + Math.sin(x * 0.02 + wavePhase) * (Math.sin(x * 0.01) * waveAmplitude * 2);
                if (x === 0) ctxWave.moveTo(x, y);
                else ctxWave.lineTo(x, y);
            }
            ctxWave.stroke();
            wavePhase += waveSpeed;
            requestAnimationFrame(animateKaren);
        }
        animateKaren();

        function setKarenState(state) {
            const dialog = document.getElementById('karenDialog');
            if (state === 'idle') {
                waveSpeed = 0.05; waveAmplitude = 10;
                typeWriterEffect("STANDBY...", dialog);
                dialog.style.color = "#4ade80"; 
            } else if (state === 'scanning') {
                waveSpeed = 0.3; waveAmplitude = 30;
                dialog.innerText = "ANALYZING...";
                dialog.style.color = "#facc15"; 
            } else if (state === 'checking') {
                waveSpeed = 0.2; waveAmplitude = 20;
                dialog.innerText = "CHECKING SEQ...";
                dialog.style.color = "#3b82f6"; 
            } else if (state === 'success') {
                waveSpeed = 0.02; waveAmplitude = 5;
                dialog.style.color = "#4ade80"; 
            } else if (state === 'fail') {
                waveSpeed = 0.1; waveAmplitude = 50;
                dialog.style.color = "#f87171"; 
            }
        }

        function typeWriterEffect(text, element) {
            element.innerText = "";
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    element.innerText += text.charAt(i);
                    i++;
                } else {
                    clearInterval(timer);
                }
            }, 50);
        }

        function initCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const monthNames = ["JAN", "FEB", "MAR", "APR", "MEI", "JUN", "JUL", "AGU", "SEP", "OKT", "NOV", "DES"];
            document.getElementById('calMonth').innerText = monthNames[month];
            document.getElementById('calYear').innerText = year;
            document.getElementById('currentDateDisplay').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' }).toUpperCase();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;
            for(let i=1; i<=daysInMonth; i++) {
                const isToday = i === today;
                const className = isToday ? "bg-green-600 text-black font-bold rounded-sm shadow-[0_0_10px_rgba(74,222,128,0.5)] aspect-square flex items-center justify-center border border-green-400" : "text-gray-500 hover:text-green-400 hover:bg-green-900/30 rounded-sm cursor-default aspect-square flex items-center justify-center transition-colors";
                grid.innerHTML += `<div class="${className}">${i}</div>`;
            }
        }
        initCalendar();

        const video = document.getElementById('video');
        const loadingDiv = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const loadingDetail = document.getElementById('loadingDetail');
        const cameraSelect = document.getElementById('cameraSelect');
        const karenDialog = document.getElementById('karenDialog');
        const btnScan = document.getElementById('btnScan');
        const actionButtons = document.getElementById('actionButtons');
        const btnSave = document.getElementById('btnSave');
        
        let labeledFaceDescriptors = [];
        let faceMatcher;
        let currentStream;
        let currentBestMatch = null; 

        // ================= PENGATURAN DATA =================
        const labels = ['Ichsan']; 
        const baseImageBaseUrl = 'https://raw.githubusercontent.com/ichsanazmi/ichsanazmi.github.io/master/produktif/labeled_images';
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzoAIKLCAWts3IF4LvIxDPiuu17CGxn8naI1oIqMoMURCLbK64VKVGxY7_x-9XqwHmXhA/exec';
        const MODEL_URL = 'https://raw.githubusercontent.com/ichsanazmi/ichsanazmi.github.io/master/produktif/models';
        
        Promise.all([
            faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]).then(startSystem).catch(err => {
            console.error(err);
            alert("Gagal memuat model AI.");
            showError("Gagal Download Model AI");
        });

        async function startSystem() {
            loadingText.innerText = "LOADING MODULES...";
            try {
                labeledFaceDescriptors = await loadLabeledImages();
                populateManualSelect(); // Isi dropdown manual
                startVideo();
            } catch (error) {
                console.error(error);
                showError(error.message);
            }
        }

        function populateManualSelect() {
            const select = document.getElementById('manualNameSelect');
            select.innerHTML = '';
            labels.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
        }

        function showError(msg) {
            loadingDiv.style.display = 'flex';
            loadingText.innerText = "SYSTEM FAILURE";
            loadingText.className = "text-xl font-bold text-red-500 font-mono";
            loadingDetail.innerText = msg;
        }

        async function fetchImageWithFallback(baseUrl, label, index) {
            const extensions = ['jpg', 'png', 'jpeg', 'JPG', 'PNG'];
            for (const ext of extensions) {
                const url = `${baseUrl}/${label}/${index}.${ext}`;
                try {
                    const response = await fetch(url, { method: 'HEAD' });
                    if (response.ok) return await faceapi.fetchImage(url);
                } catch (e) {}
            }
            return await faceapi.fetchImage(`${baseUrl}/${label}/${index}.jpg`);
        }

        async function loadLabeledImages() {
            return Promise.all(
                labels.map(async label => {
                    const descriptions = [];
                    loadingDetail.innerText = `DOWNLOADING: ${label}...`;
                    for (let i = 1; i <= 2; i++) {
                        try {
                            const img = await fetchImageWithFallback(baseImageBaseUrl, label, i);
                            const detections = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                            if (detections) descriptions.push(detections.descriptor);
                        } catch(e) { console.warn(`Gagal ambil foto untuk ${label} urutan ${i}.`, e); }
                    }
                    if (descriptions.length === 0) throw new Error(`Gagal memuat foto wajah untuk: ${label}`);
                    return new faceapi.LabeledFaceDescriptors(label, descriptions);
                })
            );
        }

        async function getCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                cameraSelect.innerHTML = '<option value="">INPUT...</option>';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `CAM ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                cameraSelect.onchange = () => startVideo(cameraSelect.value);
            } catch (err) { console.warn("Cam list error", err); }
        }

        function startVideo(deviceId = null) {
            loadingDiv.style.display = 'none'; 
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());
            const constraints = { video: deviceId ? { deviceId: { exact: deviceId } } : {} };
            
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                currentStream = stream;
                video.srcObject = stream;
                if (cameraSelect.options.length <= 1) getCameras();
            }).catch(err => {
                alert("Gagal akses kamera.");
                showError("CAMERA ACCESS DENIED");
            });
        }

        video.addEventListener('play', () => {
            if (labeledFaceDescriptors.length > 0) {
                faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.6);
            }
            btnScan.disabled = false;
        });

        function toggleMode(mode) {
            if (mode === 'scanning') {
                btnScan.classList.remove('hidden');
                // Pastikan ring progress reset
                document.querySelector('.progress-ring__circle').style.strokeDashoffset = 301.59;
                
                actionButtons.classList.add('hidden');
                setKarenState('idle');
            } else if (mode === 'review') {
                btnScan.classList.add('hidden');
                actionButtons.classList.remove('hidden');
                actionButtons.classList.add('flex'); 
            }
        }

        function resetScanner() {
            toggleMode('scanning');
            currentBestMatch = null;
        }

        // ================= LONG PRESS LOGIC (Perbaikan) =================
        let pressTimer;
        let pressStartTime;
        let progressInterval;
        const LONG_PRESS_DURATION = 10000; // 10 detik
        const SHORT_CLICK_THRESHOLD = 500; // 0.5 detik
        
        const circle = document.querySelector('.progress-ring__circle');
        const ringContainer = document.getElementById('progressRing');
        const circumference = 301.59; 
        circle.setAttribute('r', 48); // Set radius for consistency
        circle.setAttribute('cx', 56);
        circle.setAttribute('cy', 56);


        // Mouse Events
        btnScan.addEventListener('mousedown', startPress);
        btnScan.addEventListener('mouseup', endPress);
        btnScan.addEventListener('mouseleave', endPress);
        
        // Touch Events
        btnScan.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(); });
        btnScan.addEventListener('touchend', (e) => { e.preventDefault(); endPress(); });

        function startPress() {
            if (btnScan.disabled || pressTimer) return;
            
            pressStartTime = Date.now();
            circle.style.strokeDashoffset = circumference;
            ringContainer.classList.add('active'); // Show ring on press
            
            // Start progress animation
            const step = 50; 
            progressInterval = setInterval(() => {
                const elapsedTime = Date.now() - pressStartTime;
                const offset = circumference - (elapsedTime / LONG_PRESS_DURATION) * circumference;
                circle.style.strokeDashoffset = offset;
                
                if (elapsedTime >= LONG_PRESS_DURATION) {
                    clearInterval(progressInterval);
                }
            }, step);

            // Set timer for long press trigger
            pressTimer = setTimeout(() => {
                // Trigger Action setelah 10 detik
                openSecretModal();
                endPress(true); // True to bypass short click logic
            }, LONG_PRESS_DURATION);
        }

        function endPress(isLongPressTriggered = false) {
            const pressDuration = Date.now() - pressStartTime;
            
            clearTimeout(pressTimer);
            clearInterval(progressInterval);
            circle.style.strokeDashoffset = circumference;
            ringContainer.classList.remove('active'); // Hide ring

            // Reset timer variable
            pressTimer = null; 
            
            if (isLongPressTriggered) {
                // Do nothing, action already executed by setTimeout
                return; 
            }

            // Jika durasi tekan kurang dari 0.5 detik, anggap sebagai single click (Scan Wajah)
            if (pressDuration < SHORT_CLICK_THRESHOLD) {
                captureSnapshot();
            }
            // Jika durasi antara 0.5 detik dan 10 detik, anggap sebagai batal dan tidak melakukan apa-apa
        }

        // Secret Modal Logic
        function openSecretModal() {
            document.getElementById('secretModal').classList.remove('hidden');
        }

        function closeSecretModal() {
            document.getElementById('secretModal').classList.add('hidden');
        }

        function submitManualAttendance() {
            const selectedName = document.getElementById('manualNameSelect').value;
            currentBestMatch = { name: selectedName, accuracy: 100 };
            
            closeSecretModal();
            // Langsung eksekusi save tanpa scan wajah
            saveAttendance(true); // true = force manual
        }

        // ================= SEQUENCE LOGIC (LOCAL STORAGE) =================
        function getSequenceMessage(name) {
            const today = new Date().toLocaleDateString('id-ID');
            const key = `attendance_count_${today}_${name}`;
            
            // Ambil data jumlah absen hari ini (default 0)
            let count = parseInt(localStorage.getItem(key) || '0');
            
            let message = "";
            let canSubmit = true;

            // Logika Pesan Berdasarkan Urutan
            if (count === 0) {
                message = `SELAMAT PAGI, ${name}`;
            } else if (count === 1) {
                message = `MAU ISTIRAHAT, ${name}?`;
            } else if (count === 2) {
                message = `SEMOGA ALLAH MUDAHKAN, ${name}`;
            } else if (count === 3) {
                message = `HATI-HATI DIJALAN, ${name}`;
            } else {
                message = `ANDA SUDAH SELESAI.`;
                canSubmit = false;
            }

            return { message, canSubmit, currentCount: count };
        }

        function incrementLocalSequence(name) {
            const today = new Date().toLocaleDateString('id-ID');
            const key = `attendance_count_${today}_${name}`;
            let count = parseInt(localStorage.getItem(key) || '0');
            localStorage.setItem(key, count + 1);
        }

        async function checkAttendanceStatus(name) {
            setKarenState('checking');
            
            // Simulasi delay cek database (local)
            await new Promise(r => setTimeout(r, 800));
            
            const status = getSequenceMessage(name);
            
            return {
                status: 'success',
                pesan: status.message,
                boleh_absen: status.canSubmit
            };
        }

        async function captureSnapshot() {
            if (!faceMatcher || btnScan.disabled) return;
            
            // Nonaktifkan tombol segera setelah dipicu
            btnScan.disabled = true;

            setKarenState('scanning');

            setTimeout(async () => {
                const detections = await faceapi.detectAllFaces(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
                    .withFaceLandmarks()
                    .withFaceDescriptors();
                
                let bestResult = null;
                if (detections.length > 0) {
                    const results = detections.map(d => faceMatcher.findBestMatch(d.descriptor));
                    const knownFace = results.find(r => r.label !== 'unknown');
                    if (knownFace) bestResult = knownFace;
                    else bestResult = results[0]; 
                }

                if (bestResult && bestResult.label !== 'unknown') {
                    const name = bestResult.label;
                    currentBestMatch = { name: name, accuracy: Math.round((1-bestResult.distance)*100) };
                    
                    const status = await checkAttendanceStatus(name);
                    
                    if (status.status === 'success') {
                        setKarenState('success');
                        typeWriterEffect(status.pesan, karenDialog);
                        if (status.boleh_absen) {
                            toggleMode('review');
                        } else {
                            // Jika sudah 4x, blokir
                            setTimeout(() => {
                                typeWriterEffect("MAX LIMIT REACHED.", karenDialog);
                                setTimeout(resetScanner, 2000);
                            }, 2000);
                        }
                    } else {
                        setKarenState('fail');
                        typeWriterEffect("SYSTEM ERROR.", karenDialog);
                        setTimeout(resetScanner, 2000);
                    }

                } else {
                    setKarenState('fail');
                    typeWriterEffect("AKSES DITOLAK.", karenDialog);
                    setTimeout(resetScanner, 2000);
                }
                btnScan.disabled = false;
            }, 1500);
        }

        function saveAttendance(isManual = false) {
            if (!currentBestMatch) return;

            if (isManual) {
                const status = getSequenceMessage(currentBestMatch.name);
                typeWriterEffect(status.message, karenDialog); // Clean message (no prefix)
                if (!status.canSubmit) {
                    alert("User ini sudah mencapai limit harian.");
                    return;
                }
            }

            const originalBtnContent = isManual ? '' : btnSave.innerHTML;
            if(!isManual) {
                btnSave.innerHTML = `<div class="loader w-4 h-4 border-2 border-green-500 border-t-transparent"></div>`;
                btnSave.disabled = true;
            } else {
                setKarenState('checking'); // Visual feedback manual
            }

            const now = new Date();
            const dataKirim = {
                action: 'save',
                nama: currentBestMatch.name,
                tanggal: now.toLocaleDateString('id-ID'),
                jam: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':'),
                device: navigator.userAgent + (isManual ? ' [MANUAL]' : '')
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataKirim)
            }).then(() => {
                // Sukses Kirim -> Update Counter Lokal
                incrementLocalSequence(currentBestMatch.name);
                
                setKarenState('success');
                typeWriterEffect("DATA TERSIMPAN.", karenDialog);
                
                setTimeout(() => {
                    if (!isManual) {
                        btnSave.innerHTML = originalBtnContent;
                        btnSave.disabled = false;
                    }
                    resetScanner();
                }, 2000);
            }).catch(error => {
                console.error('Error:', error);
                alert("Gagal koneksi.");
                if (!isManual) {
                    btnSave.innerHTML = originalBtnContent;
                    btnSave.disabled = false;
                }
            });
        }
    </script>
</body>
