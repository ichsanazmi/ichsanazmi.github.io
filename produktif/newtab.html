<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Sholat & Log</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <style>
    :root{
      --islamic-green: #10b981;
      --islamic-gold: #f59e0b;
      --islamic-dark: #064e3b;
      --muted: #6b7280;
    }

    html,body { height:100%; }
    body{
      background: linear-gradient(135deg, #f0fdf4 0%, #f0f9ff 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .bg-overlay {
      position:fixed; inset:0;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(59, 130, 246, 0.03));
      pointer-events:none; z-index:0;
    }

    .glass-dark {
      background: rgba(255,255,255, 0.95);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(16, 185, 129, 0.1);
    }

    .soft-shadow-lg { box-shadow: 0 20px 60px rgba(16, 185, 129, 0.12), 0 4px 16px rgba(0,0,0, 0.06); }

    .icon-circle { 
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(245, 158, 11, 0.1));
      color: var(--islamic-green);
      border-radius:9999px; display:inline-flex; align-items:center; justify-content:center;
      width:56px; height:56px; font-size: 28px;
    }
    .icon-circle.large { width:72px; height:72px; font-size: 36px; }

    .gold { color: var(--islamic-gold); }
    .green { color: var(--islamic-green); }

    .badge-prayer {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(245, 158, 11, 0.1));
      border-left: 4px solid var(--islamic-gold);
    }

    .prayer-time {
      display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: center;
      padding: 1rem; border-radius: 0.875rem; transition: all 0.3s ease;
      border-bottom: 1px solid rgba(16, 185, 129, 0.08);
    }
    .prayer-time:hover { background: rgba(16, 185, 129, 0.06); transform: translateX(4px); }

    /* Scrollbar untuk Log */
    .log-scroll::-webkit-scrollbar { width: 4px; }
    .log-scroll::-webkit-scrollbar-track { background: transparent; }
    .log-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    .log-scroll::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out; }
  </style>
</head>
<body>

  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="content-wrap px-4 md:px-6 py-6 w-full mx-auto relative z-10 flex flex-col items-center justify-center min-h-screen">
    
    <!-- Container terpusat untuk Jam & Jadwal Sholat -->
    <div class="w-full max-w-md space-y-6">

      <!-- Clock Card + Log Sheet2 -->
      <div class="glass-dark rounded-2xl p-6 soft-shadow-lg animate-fade-in-up">
        <div class="text-center">
          <div class="icon-circle large mx-auto mb-4">
            <span class="material-icons">schedule</span>
          </div>
          <div id="clock" class="text-5xl md:text-6xl font-bold text-gray-900" style="font-variant-numeric: tabular-nums;">--:--:--</div>
          <div id="date" class="text-sm text-gray-600 mt-3 font-medium"></div>

          <!-- AREA LOG SHEET 2 DI BAWAH JAM -->
          <div class="mt-6 pt-4 border-t border-gray-100">
             <div class="flex items-center justify-between mb-2 px-1">
                <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Log Kedatangan</span>
                <span class="text-[10px] text-gray-400 bg-gray-50 px-2 py-0.5 rounded-full border border-gray-100">Sheet2 A & B</span>
             </div>
             
             <!-- List Container -->
             <div id="logContainer" class="h-40 overflow-y-auto log-scroll bg-gray-50/50 rounded-xl border border-gray-100 p-2 space-y-2">
                 <!-- Loading State -->
                 <div class="flex flex-col items-center justify-center h-full text-gray-400 gap-2">
                    <span class="material-icons animate-spin text-sm">sync</span>
                    <span class="text-xs">Memuat data...</span>
                 </div>
             </div>
          </div>
        </div>
      </div>

      <!-- Prayer Times Card -->
      <div id="prayerCard" class="glass-dark rounded-2xl p-6 soft-shadow-lg animate-fade-in-up" style="animation-delay: 0.1s;">
        <div class="flex items-center gap-3 mb-5">
          <div class="icon-circle">
            <span class="material-icons">mosque</span>
          </div>
          <div>
            <h2 class="text-lg font-bold text-gray-900">Jadwal Sholat</h2>
            <p id="prayerLocation" class="text-xs text-gray-500 mt-1 font-semibold">—</p>
          </div>
        </div>
        
        <div class="mb-5 p-4 rounded-xl badge-prayer">
          <div class="text-xs text-gray-600 font-bold uppercase tracking-wider">Sholat Berikutnya</div>
          <div class="flex items-baseline gap-2 mt-3">
            <div id="nextPrayerLabel" class="text-3xl font-bold green">—</div>
            <div id="countdown" class="text-sm font-semibold text-gray-700">—</div>
          </div>
        </div>

        <div class="mb-5 pb-5 border-b border-gray-200">
          <select id="citySelect" class="w-full px-3 py-2 rounded-lg border border-gray-200 bg-white text-sm font-medium focus:outline-none focus:ring-2 focus:ring-green-500 mb-2"></select>
          <input id="manualCity" placeholder="Atau ketik kota..." class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-green-500" style="display:none;" />
        </div>

        <div id="prayerTimes" class="space-y-0">
          <div class="muted text-sm">Memuat jadwal...</div>
        </div>
      </div>

    </div>
  </div>

<script>
/* ================== CONFIG ================== */
// PENTING: GANTI URL DI BAWAH DENGAN URL WEB APP GOOGLE SCRIPT ANDA
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbzoAIKLCAWts3IF4LvIxDPiuu17CGxn8naI1oIqMoMURCLbK64VKVGxY7_x-9XqwHmXhA/exec";
const ALADHAN_METHOD = "20";

const esc = s => String(s ?? "").replace(/[&<>"]/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[m]));
const q = id => document.getElementById(id);

/* ================== CLOCK ================== */
function updateClock(){
  const now = new Date();
  q('clock').textContent = now.toLocaleTimeString('id-ID', {hour12:false});
  q('date').textContent = now.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
setInterval(updateClock, 500);
updateClock();

/* =========== SHEET2 LOG DATA =========== */
async function loadSheet2Data() {
    const container = q('logContainer');
    
    try {
        // PERUBAHAN DI SINI: Menambahkan ?action=log untuk meminta data Sheet2
        const res = await fetch(SHEETS_API_URL + "?action=log");
        if (!res.ok) throw new Error("Gagal terhubung");
        const json = await res.json();
        
        const rows = json.data || [];

        if(rows.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-gray-400">
                    <span class="text-xs">Belum ada data di Sheet2</span>
                </div>`;
            return;
        }

        // Render List
        let html = '';
        rows.forEach(item => {
            // Coba ambil jam saja jika formatnya panjang
            let waktuTampil = item.waktu;
            // Jika ada spasi (misal "25/11/2025 08:00"), ambil bagian jamnya
            if(waktuTampil.includes(' ')) {
                waktuTampil = waktuTampil.split(' ')[1]; 
            }

            html += `
                <div class="flex items-center justify-between p-2 bg-white rounded-lg border border-gray-100 shadow-sm animate-fade-in-up">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-8 h-8 rounded-full bg-green-50 text-green-600 flex items-center justify-center flex-shrink-0 text-xs font-bold border border-green-100">
                            ${item.nama.substring(0,2).toUpperCase()}
                        </div>
                        <div class="text-sm font-semibold text-gray-700 truncate">${esc(item.nama)}</div>
                    </div>
                    <div class="text-xs font-mono font-medium text-gray-500 bg-gray-50 px-2 py-1 rounded border border-gray-100">
                        ${esc(waktuTampil)}
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;

    } catch (e) {
        console.error(e);
        container.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full text-red-400 gap-1">
               <span class="material-icons text-sm">error_outline</span>
               <span class="text-[10px]">Gagal memuat log</span>
            </div>`;
    }
}

// Load data Sheet2 saat mulai dan refresh setiap 30 detik
loadSheet2Data();
setInterval(loadSheet2Data, 30000); 

/* =========== PRAYER TIMES =========== */
const presetCities = ["Jakarta","Bandung","Surabaya","Medan","Semarang","Yogyakarta","Makassar","Banda Aceh","Palembang","Denpasar"];
const citySelect = q('citySelect');
const prayerTimesEl = q('prayerTimes');
const nextPrayerLabel = q('nextPrayerLabel');
const countdownEl = q('countdown');

function populateCities(){
  presetCities.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; citySelect.appendChild(o); });
  const other = document.createElement('option'); other.value='__other__'; other.textContent='Lainnya...'; citySelect.appendChild(other);
  citySelect.value = localStorage.getItem('selectedCity') || "Jakarta";
}

async function fetchPrayerTimes(city){
  try {
      const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Indonesia&method=${ALADHAN_METHOD}`);
      const data = await res.json();
      renderPrayerData(data.data, city);
  } catch(e) { prayerTimesEl.innerHTML = `<div class="text-red-500 text-sm">Gagal memuat jadwal.</div>`; }
}

function renderPrayerData(data, city){
    q('prayerLocation').textContent = city + ", Indonesia";
    const timings = data.timings;
    const order = { 'Fajr':'Subuh', 'Dhuhr':'Dzuhur', 'Asr':'Ashar', 'Maghrib':'Maghrib', 'Isha':'Isya' };
    
    let html = '';
    for(const [key, label] of Object.entries(order)){
        html += `<div class="prayer-time"><div class="text-green-600 font-bold w-20">${label}</div><div class="font-bold text-gray-800 text-lg">${timings[key]}</div></div>`;
    }
    prayerTimesEl.innerHTML = html;
    
    const now = new Date();
    let nextName = "Besok"; let nextTime = null;
    for(const [key, label] of Object.entries(order)){
        const [h,m] = timings[key].split(':');
        const pDate = new Date(); pDate.setHours(h,m,0);
        if(pDate > now) { nextName = label; nextTime = pDate; break; }
    }
    nextPrayerLabel.textContent = nextName;
    if(nextTime) {
        countdownEl.textContent = "Menunggu...";
    }
}

populateCities();
fetchPrayerTimes(citySelect.value);
citySelect.addEventListener('change', (e) => {
    if(e.target.value !== '__other__') {
        localStorage.setItem('selectedCity', e.target.value);
        fetchPrayerTimes(e.target.value);
    }
});

</script>
</body>
</html>
