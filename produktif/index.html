<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produktivitas Bento</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font: Micro 5 (Untuk Tampilan Jam) -->
    <link href="https://fonts.googleapis.com/css2?family=Micro+5&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles and Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class', // Menggunakan class 'dark' untuk mode gelap
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#0a0a0a',
                        'dark-card': '#1f1f1f',
                        'dark-border': '#27272a',
                        'light-bg': '#f3f4f6',
                        'light-card': '#ffffff',
                        'light-border': '#e5e7eb',
                        'light-text': '#1f2937',
                        'light-subtext': '#6b7280',
                        'light-primary': '#10b981', // emerald
                        'light-accent': '#3b82f6', // blue
                        'dark-accent': '#93c5fd', // light blue
                    },
                    fontSize: {
                        'huge': '8rem', /* 8xl */
                        'colossal': '14rem', /* 224px */
                    },
                    fontFamily: {
                        'micro5': ['Micro 5', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Font for Clock */
        .font-micro5 {
            font-family: 'Micro 5', sans-serif;
            /* Tambahkan sedikit cahaya (glow) putih untuk kontras yang lebih baik */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); 
        }

        /* Loading Spinner Animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            animation: spin 1s linear infinite;
        }

        /* Scrollbar styles (adjust based on dark/light mode) */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #3f3f46;
            border-radius: 20px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #52525b;
        }
        .light .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #9ca3af;
            border-radius: 20px;
        }
        .light .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #6b7280;
        }

        /* Default is Dark Mode */
        .bento-card {
            display: flex;
            flex-direction: column;
            background-color: var(--tw-colors-dark-card);
            border-color: var(--tw-colors-dark-border);
            color: white;
        }
        
    </style>
</head>
<body class="bg-dark-bg text-zinc-100 font-sans min-h-screen flex items-center justify-center p-4 sm:p-8 dark"> <!-- Class 'dark' di body sebagai default -->

    <!-- Main Grid Container: Ditingkatkan agar item baru muat -->
    <div class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-3 gap-4 auto-rows-[minmax(180px,auto)]">
        
        <!-- 1. WIDE CLOCK & CALENDAR (3x1) - MINIMALIS & TRANSPARAN -->
        <div class="bento-card md:col-span-3 rounded-3xl p-3 overflow-hidden bg-transparent border-none shadow-none">
            
            <div class="flex flex-col md:flex-row h-full items-start md:items-center justify-between gap-4 overflow-hidden py-0"> 
                
                <!-- Minimal Clock (Left/Center) -->
                <div class="md:w-1/2 flex flex-col items-center sm:items-start justify-center pl-4 md:pl-0 w-full md:w-1/2"> 
                    <div id="current-time" class="text-huge sm:text-colossal font-extrabold text-white font-micro5 tracking-tight transition-opacity duration-300 leading-none">
                        --:--
                    </div>
                    <div id="current-day" class="text-xs text-zinc-400 mt-[-1.5rem] sm:mt-[-3rem] dark:text-zinc-400 text-zinc-400">
                        --
                    </div>
                </div>

                <!-- Mini Calendar (Right) - TRANSPARAN & NAVIGASI -->
                <div id="calendar-wrapper" class="hidden sm:flex md:w-1/2 justify-center md:justify-end pb-1 md:pb-0 pr-4 md:pr-0">
                    <!-- Calendar will be injected here via JS -->
                </div>
                
            </div>
        </div>
        
        <!-- 2. DAILY TRACKER (Fitur Utama: 2x2) - BERIKUTNYA -->
        <div class="bento-card md:col-span-2 md:row-span-2 rounded-3xl p-6 shadow-xl overflow-hidden bg-zinc-900 border-zinc-800 dark:bg-zinc-900 dark:border-zinc-800 transition-colors duration-500">
            
            <div class="flex flex-col h-full overflow-hidden">
                
                <!-- Date Navigation BARU (Termasuk Tombol Sync Cloud dan Mode Switch) -->
                <div class="flex items-center justify-between mb-4 p-3 rounded-2xl backdrop-blur-sm transition-colors duration-500 bg-zinc-800/50 border-zinc-700/30 dark:bg-zinc-800/50 dark:border-zinc-700/30 light:bg-gray-100/70 light:border-gray-300/50">
                    
                    <button id="prev-date-btn" class="p-2 rounded-xl transition-colors duration-300 text-zinc-400 hover:text-white dark:text-zinc-400 dark:hover:bg-zinc-700 light:text-gray-600 light:hover:bg-gray-200">
                        <i data-lucide="chevron-left" width="20" height="20"></i>
                    </button>
                    
                    <div class="text-center flex-1 dark:text-zinc-100 light:text-light-text">
                        <div id="date-label" class="text-xs font-semibold uppercase tracking-widest text-zinc-500 dark:text-zinc-500 light:text-light-subtext">
                            Hari Ini
                        </div>
                        <div id="date-display" class="font-medium text-lg sm:text-xl">
                            -
                        </div>
                    </div>

                    <!-- Tombol Mode Switch BARU -->
                    <button id="mode-switch-btn" class="p-2 ml-2 rounded-xl transition-all duration-300 text-zinc-400 hover:text-white dark:hover:bg-zinc-700 light:text-light-subtext light:hover:text-light-text light:hover:bg-gray-200" title="Ganti Mode UI">
                        <i id="mode-icon" data-lucide="sun" width="16" height="16"></i>
                    </button>

                    <!-- Tombol Sync Cloud DIPINDAH di sini -->
                    <button id="sync-btn" class="p-2 hover:text-blue-400 rounded-xl transition-all flex items-center gap-1 group dark:hover:bg-zinc-700 light:hover:bg-gray-200" title="Sinkronisasi ke Google Sheet">
                        <span id="sync-text" class="text-[10px] font-semibold uppercase tracking-wider hidden sm:inline dark:group-hover:text-blue-400 light:text-light-subtext light:group-hover:text-light-accent">Sync Cloud</span>
                        <i data-lucide="cloud-upload" width="16" height="16" class="dark:text-zinc-400 light:text-light-subtext"></i>
                    </button>
                    
                    <button id="next-date-btn" class="p-2 rounded-xl transition-colors duration-300 text-zinc-400 hover:text-white dark:text-zinc-400 dark:hover:bg-zinc-700 light:text-gray-600 light:hover:bg-gray-200">
                        <i data-lucide="chevron-right" width="20" height="20"></i>
                    </button>

                </div>
                <!-- Akhir Date Navigation BARU -->

                <!-- Progress Bar -->
                <div class="mb-4">
                    <div class="flex justify-between text-xs mb-2 text-zinc-400 dark:text-zinc-400 light:text-light-subtext">
                        <span>Progres Harian</span>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="h-2 bg-zinc-800 rounded-full overflow-hidden dark:bg-zinc-800 light:bg-gray-200">
                        <div id="progress-bar" class="h-full bg-emerald-500 dark:bg-emerald-500 light:bg-light-primary transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Input Task Baru -->
                <form id="task-form" class="mb-4 flex flex-col gap-2 p-3 rounded-xl border transition-colors duration-500 bg-zinc-800/30 border-zinc-700/30 dark:bg-zinc-800/30 dark:border-zinc-700/30 light:bg-gray-100/70 light:border-gray-300/50">
                    <div class="relative">
                        <input
                            type="text"
                            id="task-input"
                            placeholder="Judul tugas..."
                            class="w-full rounded-lg py-2 pl-3 pr-10 focus:outline-none focus:bg-zinc-800 transition-all text-zinc-200 text-sm placeholder:text-zinc-600 
                                dark:bg-zinc-800/50 dark:border-zinc-700/50 dark:focus:border-emerald-500/50 dark:focus:bg-zinc-800 dark:text-zinc-200 dark:placeholder:text-zinc-600
                                light:bg-white/70 light:border-gray-300 light:focus:border-light-primary light:focus:bg-white light:text-light-text light:placeholder:text-gray-400
                            "
                            autocomplete="off"
                        />
                    </div>
                    <textarea
                        id="task-desc-input"
                        rows="1"
                        placeholder="Deskripsi tambahan (opsional)..."
                        class="w-full rounded-lg py-2 px-3 focus:outline-none transition-all text-zinc-300 text-xs resize-none placeholder:text-zinc-600
                                dark:bg-zinc-800/50 dark:border-zinc-700/50 dark:focus:border-emerald-500/50 dark:focus:bg-zinc-800 dark:text-zinc-300 dark:placeholder:text-zinc-600
                                light:bg-white/70 light:border-gray-300 light:focus:border-light-primary light:focus:bg-white light:text-light-text light:placeholder:text-gray-400
                            "
                    ></textarea>
                    
                    <button 
                        type="submit"
                        id="add-task-btn"
                        disabled
                        class="self-end flex items-center gap-2 px-4 py-1.5 rounded-lg text-white text-xs font-medium transition-all dark:bg-emerald-600 dark:hover:bg-emerald-500 light:bg-light-primary light:hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <i data-lucide="plus" width="14" height="14"></i>
                        <span>Tambah</span>
                    </button>
                </form>

                <!-- Task List Container -->
                <div id="task-list" class="flex-1 overflow-y-auto pr-2 space-y-2 custom-scrollbar pb-2">
                    <!-- Tasks will be injected here via JS -->
                </div>

                <!-- Empty State Template -->
                <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center space-y-2 min-h-[80px] text-zinc-600 dark:text-zinc-600 light:text-gray-400">
                    <div class="w-10 h-10 rounded-full bg-zinc-800/50 dark:bg-zinc-800/50 light:bg-gray-200/50 flex items-center justify-center">
                        <i data-lucide="activity" class="opacity-50" width="18" height="18"></i>
                    </div>
                    <p class="text-xs">Belum ada target untuk hari ini.</p>
                </div>

            </div>
        </div>

        <!-- 3. NOTES (Catatan Cepat: 1x2) - TERAKHIR -->
        <div class="bento-card md:col-span-1 md:row-span-2 rounded-3xl p-6 shadow-xl overflow-hidden transition-colors duration-500 bg-amber-900/10 border-amber-900/20 dark:bg-amber-900/10 dark:border-amber-900/20 light:bg-yellow-100/50 light:border-yellow-300/50">
            <div class="flex items-center gap-2 mb-4 text-zinc-400 dark:text-zinc-400 light:text-light-subtext">
                <i data-lucide="sticky-note" width="18" height="18"></i>
                <h3 class="text-xs font-bold uppercase tracking-wider">Catatan Cepat</h3>
            </div>
            <textarea
                id="note-input"
                placeholder="Tulis ide atau catatan di sini..."
                class="flex-1 w-full h-full bg-transparent resize-none focus:outline-none text-sm leading-relaxed custom-scrollbar dark:text-zinc-300 dark:placeholder:text-zinc-600 light:text-light-text light:placeholder:text-gray-400"
            ></textarea>
        </div>

    </div>

    <!-- --- MODAL / POPUP DESKRIPSI --- -->
    <div id="task-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <!-- Backdrop -->
        <div id="modal-backdrop" class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity opacity-0 dark:bg-black/80 light:bg-gray-900/80"></div>
        
        <!-- Modal Content -->
        <div id="modal-content" class="relative border rounded-2xl max-w-md w-full p-6 shadow-2xl transform scale-95 transition-all opacity-0 flex flex-col max-h-[80vh] bg-zinc-900 border-zinc-700 dark:bg-zinc-900 dark:border-zinc-700 light:bg-white light:border-gray-300">
            
            <!-- Close Button -->
            <button id="close-modal-btn" class="absolute top-4 right-4 p-1 rounded-lg transition-all text-zinc-500 hover:text-zinc-100 hover:bg-zinc-800 dark:text-zinc-500 dark:hover:text-zinc-100 dark:hover:bg-zinc-800 light:text-gray-500 light:hover:text-gray-900 light:hover:bg-gray-100">
                <i data-lucide="x" width="20" height="20"></i>
            </button>

            <!-- Modal Header -->
            <div class="mb-4 pr-8">
                <h3 id="modal-title" class="text-xl font-bold leading-snug break-words dark:text-white light:text-light-text">Judul Tugas</h3>
                <div class="text-xs mt-1 font-mono text-zinc-500 dark:text-zinc-500 light:text-light-subtext" id="modal-date">Tanggal</div>
            </div>

            <!-- Divider -->
            <div class="h-px w-full mb-4 dark:bg-zinc-800 light:bg-gray-300"></div>

            <!-- Modal Body (Scrollable) -->
            <div class="flex-1 overflow-y-auto custom-scrollbar pr-2">
                <div id="modal-desc" class="text-sm leading-relaxed whitespace-pre-wrap break-words dark:text-zinc-300 light:text-light-text">
                    <!-- Deskripsi akan muncul di sini -->
                </div>
                
                <!-- Placeholder jika kosong -->
                <div id="modal-no-desc" class="hidden flex flex-col items-center justify-center py-8 dark:text-zinc-600 light:text-gray-400">
                    <i data-lucide="align-left" width="24" height="24" class="mb-2 opacity-50"></i>
                    <span class="text-xs italic">Tidak ada deskripsi tambahan.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // KONFIGURASI GOOGLE SHEETS
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8y5ena3plYJoXwotwT-NakjvI23JB6y59Qo0R4jpV8JOj4tWEDIpKQJSvX1I2tII4/exec"; 
        // ==========================================

        // --- STATE MANAGEMENT ---
        let currentDate = new Date();
        let allTasks = JSON.parse(localStorage.getItem('productivity_tasks')) || {};
        
        // State untuk Kalender (Bulan yang sedang dilihat)
        let currentCalendarDate = new Date(); // Inisialisasi dengan bulan saat ini
        
        // --- DOM ELEMENTS ---
        const bodyEl = document.body;
        const dateDisplay = document.getElementById('date-display');
        const dateLabel = document.getElementById('date-label');
        const taskListEl = document.getElementById('task-list');
        const emptyStateEl = document.getElementById('empty-state');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskDescInput = document.getElementById('task-desc-input');
        const addTaskBtn = document.getElementById('add-task-btn');
        const noteInput = document.getElementById('note-input');
        const prevDateBtn = document.getElementById('prev-date-btn');
        const nextDateBtn = document.getElementById('next-date-btn');
        const syncBtn = document.getElementById('sync-btn'); 
        
        // Clock & Calendar Elements
        const currentTimeEl = document.getElementById('current-time');
        const currentDayEl = document.getElementById('current-day');
        const calendarContainerEl = document.getElementById('calendar-wrapper'); 

        // Mode Switch Elements
        const modeSwitchBtn = document.getElementById('mode-switch-btn');
        const modeIcon = document.getElementById('mode-icon');


        // Modal Elements
        const taskModal = document.getElementById('task-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalTitle = document.getElementById('modal-title');
        const modalDate = document.getElementById('modal-date');
        const modalDesc = document.getElementById('modal-desc');
        const modalNoDesc = document.getElementById('modal-no-desc');

        // --- UI MODE LOGIC ---

        const initializeUIMode = () => {
            const savedMode = localStorage.getItem('uiMode') || 'dark';
            setUIMode(savedMode);
        };

        const setUIMode = (mode) => {
            if (mode === 'dark') {
                bodyEl.classList.add('dark');
                bodyEl.classList.remove('light');
                modeIcon.setAttribute('data-lucide', 'sun'); // Tampilkan Sun (untuk beralih ke light)
                // Warna jam diatur secara statis di HTML, kita atur ulang di sini jika perlu
                currentTimeEl.classList.add('text-white');
                currentTimeEl.classList.remove('text-light-text');
            } else {
                bodyEl.classList.add('light');
                bodyEl.classList.remove('dark');
                modeIcon.setAttribute('data-lucide', 'moon'); // Tampilkan Moon (untuk beralih ke dark)
                // Warna jam di mode terang
                currentTimeEl.classList.add('text-light-text');
                currentTimeEl.classList.remove('text-white');
            }
            localStorage.setItem('uiMode', mode);
            // Re-render icons after changing attributes
            lucide.createIcons();
            // Re-render calendar to update day color
            renderCalendar(currentCalendarDate);
        };

        const toggleUIMode = () => {
            const currentMode = bodyEl.classList.contains('dark') ? 'dark' : 'light';
            const newMode = currentMode === 'dark' ? 'light' : 'dark';
            setUIMode(newMode);
        };

        // --- HELPERS ---
        const getDateKey = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatDateDisplay = (date) => {
            return new Intl.DateTimeFormat('id-ID', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            }).format(date);
        };

        const saveTasks = () => {
            localStorage.setItem('productivity_tasks', JSON.stringify(allTasks));
            renderTasks();
            updateProgress();
        };

        // --- CLOCK & CALENDAR LOGIC ---
        let lastRenderedCalendarDay = null; // Untuk menghindari rendering kalender setiap detik

        const updateClock = () => {
            const now = new Date();
            
            // Format jam (HH:MM) - Detik Dihapus
            const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: false };
            const timeString = now.toLocaleTimeString('en-US', timeOptions);
            currentTimeEl.textContent = timeString;

            // Format hari (Contoh: Kamis, 20 November 2025)
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            const dayString = now.toLocaleDateString('id-ID', dateOptions);
            currentDayEl.textContent = dayString;

            // Render kalender hanya jika hari berubah
            const todayKey = getDateKey(now);
            if (todayKey !== lastRenderedCalendarDay) {
                // Pastikan kalender dirender ulang hanya jika bulannya adalah bulan saat ini
                if (getDateKey(currentCalendarDate).substring(0, 7) === todayKey.substring(0, 7)) {
                    renderCalendar(currentCalendarDate);
                }
                lastRenderedCalendarDay = todayKey;
            }
        };

        const changeCalendarMonth = (offset) => {
            // Ubah bulan saat ini
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + offset);
            // Render bulan yang baru
            renderCalendar(currentCalendarDate);
        };

        const renderCalendar = (date) => {
            const year = date.getFullYear();
            const month = date.getMonth();
            const today = new Date();
            const todayKey = getDateKey(today);
            const isDarkMode = bodyEl.classList.contains('dark');
            const primaryColor = isDarkMode ? 'bg-indigo-500' : 'bg-light-accent';
            const hoverColor = isDarkMode ? 'hover:bg-zinc-700/50' : 'hover:bg-gray-200';
            const textColor = isDarkMode ? 'text-zinc-300' : 'text-light-text';

            const firstDayOfMonth = new Date(year, month, 1).getDay(); // 0=Minggu, 1=Senin
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const monthName = new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(date);

            // Container utama kalender
            let calendarHTML = `
                <div class="p-1.5 w-full max-w-[200px] text-zinc-200">
                    
                    <!-- Navigasi Bulan -->
                    <div class="flex items-center justify-between font-semibold text-xs mb-1">
                        <button onclick="changeCalendarMonth(-1)" class="p-0.5 rounded-lg transition-colors text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white light:text-gray-600 light:hover:bg-gray-200">
                            <i data-lucide="chevron-left" width="14" height="14"></i>
                        </button>
                        <span class="dark:text-white light:text-light-text">${monthName}</span>
                        <button onclick="changeCalendarMonth(1)" class="p-0.5 rounded-lg transition-colors text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-white light:text-gray-600 light:hover:bg-gray-200">
                            <i data-lucide="chevron-right" width="14" height="14"></i>
                        </button>
                    </div>
                    
                    <!-- Nama Hari -->
                    <div class="grid grid-cols-7 gap-0.5 text-[10px] font-medium text-center mb-0.5">
                        ${['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map(day => 
                            `<div class="dark:text-zinc-500 light:text-gray-500">${day}</div>`
                        ).join('')}
                    </div>

                    <!-- Tanggal -->
                    <div class="grid grid-cols-7 gap-0.5">
            `;

            // Isi hari kosong sebelum tanggal 1
            const startDayIndex = firstDayOfMonth;

            for (let i = 0; i < startDayIndex; i++) {
                calendarHTML += `<div></div>`;
            }

            // Isi tanggal
            for (let day = 1; day <= daysInMonth; day++) {
                const dayDate = new Date(year, month, day);
                const currentDateStr = getDateKey(dayDate);
                const isToday = currentDateStr === todayKey;

                // Ukuran cell diperkecil (p-0.5) dan text-xs menjadi text-xs/10px
                let dayClasses = `p-0.5 text-xs rounded-lg transition-all cursor-default text-center leading-tight`;
                
                if (isToday) {
                    dayClasses += ` ${primaryColor} text-white font-bold shadow-md ring-1 ring-indigo-300`;
                } else {
                    dayClasses += ` ${hoverColor} ${textColor}`;
                }

                calendarHTML += `<div class="${dayClasses}">${day}</div>`;
            }

            calendarHTML += `
                    </div>
                </div>
            `;
            calendarContainerEl.innerHTML = calendarHTML; 
            lucide.createIcons();
        };
        
        // Expose changeCalendarMonth to window
        window.changeCalendarMonth = changeCalendarMonth;
        
        // Mulai interval jam
        setInterval(updateClock, 1000); 

        // --- MODAL LOGIC ---
        const openModal = (taskId) => {
            const key = getDateKey(currentDate);
            const task = allTasks[key].find(t => t.id === taskId);
            if (!task) return;

            // Set Content
            modalTitle.textContent = task.text;
            modalDate.textContent = formatDateDisplay(currentDate);
            
            if (task.description && task.description.trim()) {
                modalDesc.textContent = task.description;
                modalDesc.classList.remove('hidden');
                modalNoDesc.classList.add('hidden');
            } else {
                modalDesc.classList.add('hidden');
                modalNoDesc.classList.remove('hidden');
            }

            // Show Modal (Animations handled via CSS classes)
            taskModal.classList.remove('hidden');
            // Small timeout to allow CSS transition to work
            setTimeout(() => {
                modalBackdrop.classList.remove('opacity-0');
                modalContent.classList.remove('opacity-0', 'scale-95');
            }, 10);
            
            // Refresh icons in modal
            lucide.createIcons();
        };

        const closeModal = () => {
            modalBackdrop.classList.add('opacity-0');
            modalContent.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                taskModal.classList.add('hidden');
            }, 300); // Match transition duration
        };

        // Modal Event Listeners
        closeModalBtn.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !taskModal.classList.contains('hidden')) {
                closeModal();
            }
        });

        // --- RENDERING FUNCTIONS ---
        const renderDateHeader = () => {
            const todayKey = getDateKey(new Date());
            const currentKey = getDateKey(currentDate);
            
            dateLabel.textContent = currentKey === todayKey ? 'Hari Ini' : 'Tanggal';
            dateDisplay.textContent = formatDateDisplay(currentDate);
        };

        const renderTasks = () => {
            const key = getDateKey(currentDate);
            const tasks = allTasks[key] || [];
            
            taskListEl.innerHTML = '';

            const isDarkMode = bodyEl.classList.contains('dark');
            const primaryColor = isDarkMode ? 'text-emerald-500' : 'text-light-primary';
            const secondaryTextColor = isDarkMode ? 'text-zinc-500' : 'text-light-subtext';
            const mainTextColor = isDarkMode ? 'text-zinc-200' : 'text-light-text';
            const cardBg = isDarkMode ? 'bg-zinc-800/30' : 'bg-gray-100/70';
            const cardBorder = isDarkMode ? 'border-zinc-700/30' : 'border-gray-300/50';

            if (tasks.length === 0) {
                emptyStateEl.classList.remove('hidden');
                taskListEl.classList.add('hidden');
            } else {
                emptyStateEl.classList.add('hidden');
                taskListEl.classList.remove('hidden');

                tasks.forEach(task => {
                    const div = document.createElement('div');
                    
                    // Indikator jika ada deskripsi
                    const hasDesc = task.description && task.description.trim().length > 0;
                    const descIndicator = hasDesc 
                        ? `<i data-lucide="align-left" width="14" height="14" class="${secondaryTextColor} group-hover/text:text-emerald-400 transition-colors"></i>`
                        : '';

                    const completedClasses = task.completed 
                        ? `bg-zinc-900/30 border-transparent opacity-60 dark:bg-zinc-900/30 light:bg-gray-100/50` 
                        : `${cardBg} ${cardBorder} hover:border-zinc-600 dark:hover:bg-zinc-800/50 light:hover:bg-gray-200/70`;

                    const completedText = task.completed 
                        ? `line-through ${secondaryTextColor}`
                        : `${mainTextColor} group-hover/text:text-white dark:group-hover/text:text-white light:group-hover/text-light-text transition-colors`;

                    div.className = `group flex items-center gap-3 p-3 rounded-xl border transition-all duration-200 ${completedClasses}`;
                    
                    div.innerHTML = `
                        <button onclick="event.stopPropagation(); toggleTask(${task.id})" class="flex-shrink-0 transition-colors ${task.completed ? primaryColor : secondaryTextColor} p-1 dark:hover:text-zinc-300 light:hover:text-light-text">
                            <i data-lucide="${task.completed ? 'check-circle-2' : 'circle'}" width="20" height="20"></i>
                        </button>
                        
                        <!-- Bagian Teks sekarang bisa diklik untuk buka modal -->
                        <div onclick="openModal(${task.id})" class="flex-1 min-w-0 cursor-pointer group/text flex items-center gap-2">
                            <span class="truncate font-medium text-sm ${completedText}">
                                ${escapeHtml(task.text)}
                            </span>
                            ${descIndicator}
                        </div>

                        <button onclick="event.stopPropagation(); deleteTask(${task.id})" class="opacity-0 group-hover:opacity-100 text-rose-500/70 hover:text-rose-500 p-2 rounded-lg hover:bg-rose-500/10 transition-all" title="Hapus">
                            <i data-lucide="trash-2" width="16" height="16"></i>
                        </button>
                    `;
                    taskListEl.appendChild(div);
                });
            }
            
            lucide.createIcons();
        };

        const updateProgress = () => {
            const key = getDateKey(currentDate);
            const tasks = allTasks[key] || [];
            
            if (tasks.length === 0) {
                progressBar.style.width = '0%';
                progressText.textContent = '0%';
                return;
            }

            const completedCount = tasks.filter(t => t.completed).length;
            const percentage = Math.round((completedCount / tasks.length) * 100);
            
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}%`;
        };

        // --- GOOGLE SHEETS SYNC LOGIC ---
        const syncToGoogleSheets = async () => {
            if (GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")) {
                alert("Harap konfigurasi URL Google Apps Script Anda terlebih dahulu.");
                return;
            }

            // UI Loading State
            syncBtn.disabled = true;
            const spinnerSvg = `<svg class="animate-spin-custom" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`;
            syncBtn.innerHTML = `
                <span class="text-[10px] font-semibold uppercase tracking-wider hidden sm:inline group-hover:text-blue-400">Memuat...</span>
                ${spinnerSvg}
            `;

            // 1. Siapkan Data Lokal
            const payloadTasks = [];
            const dates = Object.keys(allTasks);
            
            dates.forEach(date => {
                const tasks = allTasks[date];
                if (tasks && tasks.length > 0) {
                    tasks.forEach(task => {
                        payloadTasks.push({
                            date: date, 
                            status: task.completed ? "Selesai" : "Belum",
                            text: task.text,
                            description: task.description || "" 
                        });
                    });
                }
            });

            const payload = { tasks: payloadTasks };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    redirect: "follow",
                    method: "POST",
                    referrerPolicy: "no-referrer", 
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                const resultData = await response.json();
                
                if(resultData.result === "error") throw new Error(resultData.message || "Backend error");

                if (resultData.result === "success" && resultData.data) {
                    const mergedTasks = {};

                    resultData.data.forEach((item, index) => {
                        const dateKey = item.date; 
                        if (!mergedTasks[dateKey]) mergedTasks[dateKey] = [];
                        
                        mergedTasks[dateKey].push({
                            id: Date.now() + index, 
                            text: item.text,
                            description: item.description || "", 
                            completed: item.status === "Selesai"
                        });
                    });

                    allTasks = mergedTasks;
                    saveTasks(); 
                    
                    alert(`Sukses! Sinkronisasi data berhasil.`);
                } else {
                    throw new Error("Format respon server tidak sesuai");
                }

            } catch (error) {
                console.error("Error Syncing:", error);
                let msg = error.message;
                if (msg.includes("Failed to fetch")) {
                    msg = "Gagal koneksi. Pastikan deployment script di-set ke 'Anyone' (Siapa saja).";
                }
                alert(`Gagal sinkronisasi: ${msg}`);
            } finally {
                location.reload(); 
            }
        };

        // --- EVENT HANDLERS ---

        taskInput.addEventListener('input', (e) => {
            const hasValue = e.target.value.trim().length > 0;
            addTaskBtn.disabled = !hasValue;
        });

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            const desc = taskDescInput.value.trim(); 
            if (!text) return;

            const key = getDateKey(currentDate);
            if (!allTasks[key]) allTasks[key] = [];

            allTasks[key].push({
                id: Date.now(),
                text: text,
                description: desc, 
                completed: false
            });

            taskInput.value = '';
            taskDescInput.value = ''; 
            addTaskBtn.disabled = true;
            saveTasks();
        });

        window.toggleTask = (id) => {
            const key = getDateKey(currentDate);
            if (!allTasks[key]) return;

            allTasks[key] = allTasks[key].map(t => 
                t.id === id ? { ...t, completed: !t.completed } : t
            );
            saveTasks();
        };

        window.deleteTask = (id) => {
            const key = getDateKey(currentDate);
            if (!allTasks[key]) return;

            allTasks[key] = allTasks[key].filter(t => t.id !== id);
            saveTasks();
        };

        // Expose openModal to window so it can be called from inline HTML
        window.openModal = openModal;

        prevDateBtn.addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() - 1);
            updateAll();
        });

        nextDateBtn.addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() + 1);
            updateAll();
        });

        syncBtn.addEventListener('click', syncToGoogleSheets);
        modeSwitchBtn.addEventListener('click', toggleUIMode); // NEW: Toggle mode

        noteInput.value = localStorage.getItem('productivity_note') || '';
        noteInput.addEventListener('input', (e) => {
            localStorage.setItem('productivity_note', e.target.value);
        });

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function updateAll() {
            renderDateHeader();
            renderTasks();
            updateProgress();
            // Panggil renderCalendar di updateAll agar kalender terinisialisasi saat load
            renderCalendar(currentCalendarDate);
        }

        // Initialize UI Mode and then start clock/render
        initializeUIMode();
        updateClock(); 
        updateAll();
        // Icons creation is also handled inside setUIMode and renderCalendar

    </script>
</body>
</html>
