<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produktivitas Bento</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles for Scrollbar -->
    <style>
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #3f3f46;
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #52525b;
        }

        .bento-card {
            display: flex;
            flex-direction: column;
        }

        /* Loading Spinner Animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-black text-zinc-100 font-sans min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- Main Grid Container -->
    <div class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-3 gap-4 auto-rows-[minmax(180px,auto)] md:h-[600px]">
        
        <!-- 1. DAILY TRACKER (Fitur Utama) -->
        <div class="bento-card md:col-span-2 md:row-span-2 bg-gradient-to-br from-zinc-900 to-zinc-900/50 border border-zinc-800 rounded-3xl p-6 shadow-xl overflow-hidden">
            <!-- Card Header -->
            <div class="flex items-center justify-between mb-4 text-zinc-400">
                <div class="flex items-center gap-2">
                    <i data-lucide="activity" width="18" height="18"></i>
                    <h3 class="text-xs font-bold uppercase tracking-wider">Pelacak Harian</h3>
                </div>
                <button id="sync-btn" class="hover:text-blue-400 hover:bg-zinc-800 p-1.5 rounded-lg transition-all flex items-center gap-2 group" title="Sinkronisasi ke Google Sheet">
                    <span id="sync-text" class="text-[10px] font-semibold uppercase tracking-wider hidden sm:inline group-hover:text-blue-400">Sync Cloud</span>
                    <i id="sync-icon" data-lucide="cloud-upload" width="16" height="16"></i>
                </button>
            </div>

            <div class="flex flex-col h-full overflow-hidden">
                
                <!-- Date Navigation -->
                <div class="flex items-center justify-between mb-4 bg-zinc-800/50 p-3 rounded-2xl backdrop-blur-sm border border-zinc-700/30">
                    <button id="prev-date-btn" class="p-2 hover:bg-zinc-700 rounded-xl transition-colors text-zinc-400 hover:text-white">
                        <i data-lucide="chevron-left" width="20" height="20"></i>
                    </button>
                    
                    <div class="text-center">
                        <div id="date-label" class="text-xs text-zinc-500 font-semibold uppercase tracking-widest">
                            Hari Ini
                        </div>
                        <div id="date-display" class="font-medium text-lg sm:text-xl">
                            -
                        </div>
                    </div>

                    <button id="next-date-btn" class="p-2 hover:bg-zinc-700 rounded-xl transition-colors text-zinc-400 hover:text-white">
                        <i data-lucide="chevron-right" width="20" height="20"></i>
                    </button>
                </div>

                <!-- Progress Bar -->
                <div class="mb-4">
                    <div class="flex justify-between text-xs mb-2 text-zinc-400">
                        <span>Progres Harian</span>
                        <span id="progress-text">0%</span>
                    </div>
                    <div class="h-2 bg-zinc-800 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-emerald-500 transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Input Task Baru -->
                <form id="task-form" class="mb-4 flex flex-col gap-2 bg-zinc-800/30 p-3 rounded-xl border border-zinc-700/30">
                    <div class="relative">
                        <input
                            type="text"
                            id="task-input"
                            placeholder="Judul tugas..."
                            class="w-full bg-zinc-800/50 border border-zinc-700/50 rounded-lg py-2 pl-3 pr-10 focus:outline-none focus:border-emerald-500/50 focus:bg-zinc-800 transition-all placeholder:text-zinc-600 text-zinc-200 text-sm"
                            autocomplete="off"
                        />
                    </div>
                    <textarea
                        id="task-desc-input"
                        rows="1"
                        placeholder="Deskripsi tambahan (opsional)..."
                        class="w-full bg-zinc-800/50 border border-zinc-700/50 rounded-lg py-2 px-3 focus:outline-none focus:border-emerald-500/50 focus:bg-zinc-800 transition-all placeholder:text-zinc-600 text-zinc-300 text-xs resize-none"
                    ></textarea>
                    
                    <button 
                        type="submit"
                        id="add-task-btn"
                        disabled
                        class="self-end flex items-center gap-2 px-4 py-1.5 bg-emerald-600 rounded-lg text-white text-xs font-medium hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
                    >
                        <i data-lucide="plus" width="14" height="14"></i>
                        <span>Tambah</span>
                    </button>
                </form>

                <!-- Task List Container -->
                <div id="task-list" class="flex-1 overflow-y-auto pr-2 space-y-2 custom-scrollbar pb-2">
                    <!-- Tasks will be injected here via JS -->
                </div>

                <!-- Empty State Template -->
                <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center text-zinc-600 space-y-2 min-h-[80px]">
                    <div class="w-10 h-10 rounded-full bg-zinc-800/50 flex items-center justify-center">
                        <i data-lucide="activity" class="opacity-50" width="18" height="18"></i>
                    </div>
                    <p class="text-xs">Belum ada target untuk hari ini.</p>
                </div>

            </div>
        </div>

        <!-- 2. NOTES (Catatan Cepat) -->
        <div class="bento-card md:col-span-1 md:row-span-1 bg-amber-900/10 border border-amber-900/20 rounded-3xl p-6 shadow-xl overflow-hidden">
            <div class="flex items-center gap-2 mb-4 text-zinc-400">
                <i data-lucide="sticky-note" width="18" height="18"></i>
                <h3 class="text-xs font-bold uppercase tracking-wider">Catatan Cepat</h3>
            </div>
            <textarea
                id="note-input"
                placeholder="Tulis ide atau catatan di sini..."
                class="flex-1 w-full bg-transparent resize-none focus:outline-none text-zinc-300 placeholder:text-zinc-600 text-sm leading-relaxed custom-scrollbar"
            ></textarea>
        </div>

        <!-- 3. EMPTY SLOT -->
        <div class="bento-card md:col-span-1 md:row-span-1 bg-zinc-900/30 border border-dashed border-zinc-800 rounded-3xl p-6 shadow-xl overflow-hidden">
            <div class="flex items-center gap-2 mb-4 text-zinc-400">
                <i data-lucide="construction" width="18" height="18"></i>
                <h3 class="text-xs font-bold uppercase tracking-wider">Coming Soon</h3>
            </div>
            <div class="h-full flex flex-col items-center justify-center text-zinc-700 text-center pb-8">
                <div class="w-16 h-16 rounded-2xl bg-zinc-800/30 flex items-center justify-center mb-3 animate-pulse">
                    <i data-lucide="plus" width="24" height="24"></i>
                </div>
                <p class="text-sm font-medium">Slot Kosong</p>
            </div>
        </div>

    </div>

    <!-- --- MODAL / POPUP DESKRIPSI --- -->
    <div id="task-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <!-- Backdrop -->
        <div id="modal-backdrop" class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity opacity-0"></div>
        
        <!-- Modal Content -->
        <div id="modal-content" class="relative bg-zinc-900 border border-zinc-700 rounded-2xl max-w-md w-full p-6 shadow-2xl transform scale-95 transition-all opacity-0 flex flex-col max-h-[80vh]">
            
            <!-- Close Button -->
            <button id="close-modal-btn" class="absolute top-4 right-4 p-1 text-zinc-500 hover:text-zinc-100 hover:bg-zinc-800 rounded-lg transition-all">
                <i data-lucide="x" width="20" height="20"></i>
            </button>

            <!-- Modal Header -->
            <div class="mb-4 pr-8">
                <h3 id="modal-title" class="text-xl font-bold text-white leading-snug break-words">Judul Tugas</h3>
                <div class="text-xs text-zinc-500 mt-1 font-mono" id="modal-date">Tanggal</div>
            </div>

            <!-- Divider -->
            <div class="h-px bg-zinc-800 w-full mb-4"></div>

            <!-- Modal Body (Scrollable) -->
            <div class="flex-1 overflow-y-auto custom-scrollbar pr-2">
                <div id="modal-desc" class="text-zinc-300 text-sm leading-relaxed whitespace-pre-wrap break-words">
                    <!-- Deskripsi akan muncul di sini -->
                </div>
                
                <!-- Placeholder jika kosong -->
                <div id="modal-no-desc" class="hidden flex flex-col items-center justify-center py-8 text-zinc-600">
                    <i data-lucide="align-left" width="24" height="24" class="mb-2 opacity-50"></i>
                    <span class="text-xs italic">Tidak ada deskripsi tambahan.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // KONFIGURASI GOOGLE SHEETS
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8y5ena3plYJoXwotwT-NakjvI23JB6y59Qo0R4jpV8JOj4tWEDIpKQJSvX1I2tII4/exec"; 
        // ==========================================

        // --- STATE MANAGEMENT ---
        let currentDate = new Date();
        let allTasks = JSON.parse(localStorage.getItem('productivity_tasks')) || {};
        
        // --- DOM ELEMENTS ---
        const dateDisplay = document.getElementById('date-display');
        const dateLabel = document.getElementById('date-label');
        const taskListEl = document.getElementById('task-list');
        const emptyStateEl = document.getElementById('empty-state');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskDescInput = document.getElementById('task-desc-input');
        const addTaskBtn = document.getElementById('add-task-btn');
        const noteInput = document.getElementById('note-input');
        const prevDateBtn = document.getElementById('prev-date-btn');
        const nextDateBtn = document.getElementById('next-date-btn');
        const syncBtn = document.getElementById('sync-btn'); 
        
        // Modal Elements
        const taskModal = document.getElementById('task-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalTitle = document.getElementById('modal-title');
        const modalDate = document.getElementById('modal-date');
        const modalDesc = document.getElementById('modal-desc');
        const modalNoDesc = document.getElementById('modal-no-desc');

        // --- HELPERS ---
        const getDateKey = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatDateDisplay = (date) => {
            return new Intl.DateTimeFormat('id-ID', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            }).format(date);
        };

        const saveTasks = () => {
            localStorage.setItem('productivity_tasks', JSON.stringify(allTasks));
            renderTasks();
            updateProgress();
        };

        // --- MODAL LOGIC ---
        const openModal = (taskId) => {
            const key = getDateKey(currentDate);
            const task = allTasks[key].find(t => t.id === taskId);
            if (!task) return;

            // Set Content
            modalTitle.textContent = task.text;
            modalDate.textContent = formatDateDisplay(currentDate);
            
            if (task.description && task.description.trim()) {
                modalDesc.textContent = task.description;
                modalDesc.classList.remove('hidden');
                modalNoDesc.classList.add('hidden');
            } else {
                modalDesc.classList.add('hidden');
                modalNoDesc.classList.remove('hidden');
            }

            // Show Modal (Animations handled via CSS classes)
            taskModal.classList.remove('hidden');
            // Small timeout to allow CSS transition to work
            setTimeout(() => {
                modalBackdrop.classList.remove('opacity-0');
                modalContent.classList.remove('opacity-0', 'scale-95');
            }, 10);
            
            // Refresh icons in modal
            lucide.createIcons();
        };

        const closeModal = () => {
            modalBackdrop.classList.add('opacity-0');
            modalContent.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                taskModal.classList.add('hidden');
            }, 300); // Match transition duration
        };

        // Modal Event Listeners
        closeModalBtn.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !taskModal.classList.contains('hidden')) {
                closeModal();
            }
        });

        // --- RENDERING FUNCTIONS ---
        const renderDateHeader = () => {
            const todayKey = getDateKey(new Date());
            const currentKey = getDateKey(currentDate);
            
            dateLabel.textContent = currentKey === todayKey ? 'Hari Ini' : 'Tanggal';
            dateDisplay.textContent = formatDateDisplay(currentDate);
        };

        const renderTasks = () => {
            const key = getDateKey(currentDate);
            const tasks = allTasks[key] || [];
            
            taskListEl.innerHTML = '';

            if (tasks.length === 0) {
                emptyStateEl.classList.remove('hidden');
                taskListEl.classList.add('hidden');
            } else {
                emptyStateEl.classList.add('hidden');
                taskListEl.classList.remove('hidden');

                tasks.forEach(task => {
                    const div = document.createElement('div');
                    
                    // Indikator jika ada deskripsi
                    const hasDesc = task.description && task.description.trim().length > 0;
                    const descIndicator = hasDesc 
                        ? `<i data-lucide="align-left" width="14" height="14" class="text-zinc-500 group-hover/text:text-emerald-400 transition-colors"></i>`
                        : '';

                    div.className = `group flex items-center gap-3 p-3 rounded-xl border transition-all duration-200 ${
                        task.completed 
                            ? 'bg-zinc-900/30 border-transparent opacity-60' 
                            : 'bg-zinc-800/30 border-zinc-700/30 hover:border-zinc-600 hover:bg-zinc-800/50'
                    }`;
                    
                    div.innerHTML = `
                        <button onclick="event.stopPropagation(); toggleTask(${task.id})" class="flex-shrink-0 transition-colors ${task.completed ? 'text-emerald-500' : 'text-zinc-500 hover:text-zinc-300'} p-1">
                            <i data-lucide="${task.completed ? 'check-circle-2' : 'circle'}" width="20" height="20"></i>
                        </button>
                        
                        <!-- Bagian Teks sekarang bisa diklik untuk buka modal -->
                        <div onclick="openModal(${task.id})" class="flex-1 min-w-0 cursor-pointer group/text flex items-center gap-2">
                            <span class="truncate font-medium text-sm ${task.completed ? 'line-through text-zinc-500' : 'text-zinc-200 group-hover/text:text-white transition-colors'}">
                                ${escapeHtml(task.text)}
                            </span>
                            ${descIndicator}
                        </div>

                        <button onclick="event.stopPropagation(); deleteTask(${task.id})" class="opacity-0 group-hover:opacity-100 text-rose-500/70 hover:text-rose-500 p-2 rounded-lg hover:bg-rose-500/10 transition-all" title="Hapus">
                            <i data-lucide="trash-2" width="16" height="16"></i>
                        </button>
                    `;
                    taskListEl.appendChild(div);
                });
            }
            
            lucide.createIcons();
        };

        const updateProgress = () => {
            const key = getDateKey(currentDate);
            const tasks = allTasks[key] || [];
            
            if (tasks.length === 0) {
                progressBar.style.width = '0%';
                progressText.textContent = '0%';
                return;
            }

            const completedCount = tasks.filter(t => t.completed).length;
            const percentage = Math.round((completedCount / tasks.length) * 100);
            
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}%`;
        };

        // --- GOOGLE SHEETS SYNC LOGIC ---
        const syncToGoogleSheets = async () => {
            if (GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")) {
                alert("Harap konfigurasi URL Google Apps Script Anda terlebih dahulu.");
                return;
            }

            // UI Loading State
            syncBtn.disabled = true;
            const spinnerSvg = `<svg class="animate-spin-custom" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`;
            syncBtn.innerHTML = `
                <span class="text-[10px] font-semibold uppercase tracking-wider hidden sm:inline group-hover:text-blue-400">Memuat...</span>
                ${spinnerSvg}
            `;

            // 1. Siapkan Data Lokal
            const payloadTasks = [];
            const dates = Object.keys(allTasks);
            
            dates.forEach(date => {
                const tasks = allTasks[date];
                if (tasks && tasks.length > 0) {
                    tasks.forEach(task => {
                        payloadTasks.push({
                            date: date, 
                            status: task.completed ? "Selesai" : "Belum",
                            text: task.text,
                            description: task.description || "" 
                        });
                    });
                }
            });

            const payload = { tasks: payloadTasks };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    redirect: "follow",
                    method: "POST",
                    referrerPolicy: "no-referrer", 
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                const resultData = await response.json();
                
                if(resultData.result === "error") throw new Error(resultData.message || "Backend error");

                if (resultData.result === "success" && resultData.data) {
                    const mergedTasks = {};

                    resultData.data.forEach((item, index) => {
                        const dateKey = item.date; 
                        if (!mergedTasks[dateKey]) mergedTasks[dateKey] = [];
                        
                        mergedTasks[dateKey].push({
                            id: Date.now() + index, 
                            text: item.text,
                            description: item.description || "", 
                            completed: item.status === "Selesai"
                        });
                    });

                    allTasks = mergedTasks;
                    saveTasks(); 
                    
                    alert(`Sukses! Sinkronisasi data berhasil.`);
                } else {
                    throw new Error("Format respon server tidak sesuai");
                }

            } catch (error) {
                console.error("Error Syncing:", error);
                let msg = error.message;
                if (msg.includes("Failed to fetch")) {
                    msg = "Gagal koneksi. Pastikan deployment script di-set ke 'Anyone' (Siapa saja).";
                }
                alert(`Gagal sinkronisasi: ${msg}`);
            } finally {
                location.reload(); 
            }
        };

        // --- EVENT HANDLERS ---

        taskInput.addEventListener('input', (e) => {
            const hasValue = e.target.value.trim().length > 0;
            addTaskBtn.disabled = !hasValue;
        });

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            const desc = taskDescInput.value.trim(); 
            if (!text) return;

            const key = getDateKey(currentDate);
            if (!allTasks[key]) allTasks[key] = [];

            allTasks[key].push({
                id: Date.now(),
                text: text,
                description: desc, 
                completed: false
            });

            taskInput.value = '';
            taskDescInput.value = ''; 
            addTaskBtn.disabled = true;
            saveTasks();
        });

        window.toggleTask = (id) => {
            const key = getDateKey(currentDate);
            if (!allTasks[key]) return;

            allTasks[key] = allTasks[key].map(t => 
                t.id === id ? { ...t, completed: !t.completed } : t
            );
            saveTasks();
        };

        window.deleteTask = (id) => {
            const key = getDateKey(currentDate);
            if (!allTasks[key]) return;

            allTasks[key] = allTasks[key].filter(t => t.id !== id);
            saveTasks();
        };

        // Expose openModal to window so it can be called from inline HTML
        window.openModal = openModal;

        prevDateBtn.addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() - 1);
            updateAll();
        });

        nextDateBtn.addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() + 1);
            updateAll();
        });

        syncBtn.addEventListener('click', syncToGoogleSheets);

        noteInput.value = localStorage.getItem('productivity_note') || '';
        noteInput.addEventListener('input', (e) => {
            localStorage.setItem('productivity_note', e.target.value);
        });

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function updateAll() {
            renderDateHeader();
            renderTasks();
            updateProgress();
        }

        updateAll();
        lucide.createIcons();

    </script>
</body>
</html>
